<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Starlicht+ — онлайн-кінотеатр, що перетворює звичайний вечір на кінематографічну подію." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:ital,wght@0,600;0,700&display=swap" rel="stylesheet" />
    <title>Starlicht+</title>
    <script>
      try {
        var ui = JSON.parse(localStorage.getItem('starlicht_ui') || '{}');
        document.documentElement.dataset.theme = ui.theme === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для роботи Starlicht+ потрібен JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
